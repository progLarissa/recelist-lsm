<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E9EDF5; --ink:#141B2E; --muted:#556079; --line:#D5DCE8;
  --cobalt:#1D4AB0; --saffron:#D8930E;
  --tile-bg:#1A42A0; --tile-mark:rgba(255,255,255,.17); --tile-soft:rgba(255,255,255,.08);
  --merc:#2B7A4B; --lupa:#C99410; --dia:#C8322E; --unide:#D9691C;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1322; --surface:#151D31; --surface-2:#1C263E; --ink:#E7EBF4; --muted:#9BA6BD; --line:#2A3654;
  --cobalt:#82A5F6; --saffron:#F0B53C; --tile-bg:#13296B; --tile-mark:rgba(255,255,255,.12); --tile-soft:rgba(255,255,255,.05);
  --merc:#5FC28C; --lupa:#F2C64A; --dia:#F07B76; --unide:#F4A061; color-scheme:dark }}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}

.hero{background-color:var(--tile-bg);color:#fff;
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 8px, var(--tile-mark) 8px 10px, transparent 10.5px),
    radial-gradient(circle at 50% 50%, var(--tile-soft) 0 18px, transparent 18.5px),
    radial-gradient(circle at 0 0, var(--tile-mark) 0 12px, transparent 12.5px),
    radial-gradient(circle at 100% 0, var(--tile-mark) 0 12px, transparent 12.5px),
    radial-gradient(circle at 0 100%, var(--tile-mark) 0 12px, transparent 12.5px),
    radial-gradient(circle at 100% 100%, var(--tile-mark) 0 12px, transparent 12.5px),
    linear-gradient(var(--tile-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--tile-soft) 1px, transparent 1px);
  background-size:56px 56px}
.hero-in{padding-block:36px 30px;display:grid;gap:10px}
.eyebrow{margin:0;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero h1{font-size:clamp(2.1rem,6vw,3.2rem)}
.lede{margin:0;max-width:60ch;opacity:.92}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{--c:var(--cobalt);border:0;background:none;padding:14px 12px 11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.tab .n{font-weight:400;font-size:.78rem;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.t-merc{--c:var(--merc)} .t-lupa{--c:var(--lupa)} .t-dia{--c:var(--dia)} .t-unide{--c:var(--unide)}

main{padding-block:22px 60px}
.store{--c:var(--cobalt)}
.banner{border-radius:14px;padding:18px 18px 16px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));display:grid;gap:8px;margin-bottom:16px}
.banner .top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.banner h2{font-size:1.9rem;color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--c);color:#fff}
@media (prefers-color-scheme: dark){.pill{color:#0D1322}}
.banner p{margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.prog{flex:1 1 220px;display:grid;gap:5px}
.prog small{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--c);transition:width .2s}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--c)}
.btn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.sec h3{font-size:1.2rem;padding:13px 16px 10px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--c)}
ul.items{list-style:none;margin:0;padding:4px 0}
.item label{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:9px 16px;cursor:pointer}
.item + .item label{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.item input{appearance:none;width:22px;height:22px;margin:1px 0 0;border:2px solid color-mix(in srgb,var(--c) 60%,var(--line));border-radius:6px;display:grid;place-content:center;cursor:pointer;background:var(--surface)}
.item input:checked{background:var(--c);border-color:var(--c)}
.item input:checked::after{content:"";width:11px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.name{font-weight:700}
.qty{color:var(--muted);font-weight:400}
.note{grid-column:2 / -1;font-size:.88rem;color:var(--muted);margin-top:-2px}
.price{font-size:.85rem;font-weight:700;white-space:nowrap;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--ink));font-variant-numeric:tabular-nums}
.item input:checked ~ .name,.item input:checked ~ .name .qty{text-decoration:line-through;color:var(--muted)}
.where{grid-column:2 / -1;justify-self:start;font-size:.82rem;line-height:1.35;padding:3px 9px;border-radius:7px;border-left:3px solid var(--w);background:color-mix(in srgb,var(--w) 11%,var(--surface));color:var(--ink)}
.where b{color:color-mix(in srgb,var(--w) 75%,var(--ink))}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.store.onlyleft .item.done{display:none}
.avoid{padding:12px 16px;display:grid;gap:6px}
.avoid p{margin:0;font-size:.93rem;color:var(--muted)}
.avoid p b{color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.card{--c:var(--cobalt);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;border-top:4px solid var(--c)}
.card h3{font-size:1.15rem}
.card p{margin:0;font-size:.93rem}
.card .muted{color:var(--muted)}
.tag{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--surface)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.sub{font-size:1.45rem;margin:22px 0 12px}
.tip{margin:0 0 16px;color:var(--muted);font-size:.93rem}
</style>

const KEY="listas-compras-v2";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tabs=document.getElementById("tabs"), main=document.getElementById("main");
const TABS=[{id:"resumo",name:"Resumo",cls:""},...STORES];
tabs.innerHTML=TABS.map(t=>{
  const n=t.sections?t.sections.reduce((a,s)=>a+s.items.length,0):"";
  return `<button class="tab ${t.cls}" role="tab" data-id="${t.id}" aria-selected="false">${t.sections?'<span class="dot"></span>':''}${t.name}${n?` <span class="n" id="n-${t.id}">${n}</span>`:''}</button>`;
}).join("");

function resumo(){
  return `<section id="p-resumo" role="tabpanel">
  <div class="cards">
   ${STORES.map(s=>`<div class="card" style="--c:${s.color}"><h3>${s.name}</h3><p><b>${s.pill}</b></p><p class="muted">${s.intro}</p><p><button class="btn go" data-go="${s.id}" style="--c:${s.color}">Abrir lista</button></p></div>`).join("")}
  </div>
  <p class="tip">Marca não importa: escolham sempre a mais barata olhando o €/kg da etiqueta e, entre duas parecidas, a que tiver menos açúcar e sal. Os preços são os dos vossos tickets, como referência.</p>
  <h2 class="sub">Cereais para o iogurte</h2>
  <div class="cards">
   <div class="card" style="--c:var(--dia)"><h3>Muesli crunchy 0 %</h3><p>Hoje: Mercadona, 500 g a 1,90–2,00 €.</p><p><b>Igual no Dia:</b> Crunchy muesli 0 % Gran Dia 500 g a 1,99 € — mesmo tipo e dá para comprar a pé. Provem um pacote antes de trocar de vez.</p><p><span class="tag" style="--c:var(--dia)">Dia</span> <span class="tag" style="--c:var(--merc)">Mercadona</span></p></div>
   <div class="card" style="--c:var(--merc)"><h3>Corn flakes</h3><p>Hoje: Lupa, 500 g a 1,50 €, versão com açúcar.</p><p><b>Melhor:</b> corn flakes 0 % açúcares do Mercadona, também a 1,50 € e com menos de 1 g de açúcar por 100 g.</p><p><span class="tag" style="--c:var(--merc)">Mercadona</span></p></div>
  </div>
  <h2 class="sub">Docinhos — as melhores escolhas</h2>
  <div class="cards">
   <div class="card" style="--c:var(--merc)"><h3>Chocolate negro 72–85 %</h3><p>Melhor relação preço–saúde. O saco de porções 72 % sai caro por kg (200 g a 3,25–3,65 €); em tablete costuma sair mais barato. Porções 85 % a 1,95 €.</p><p><span class="tag" style="--c:var(--merc)">Mercadona</span></p></div>
   <div class="card" style="--c:var(--merc)"><h3>Chocolate com leite 0 % açúcares</h3><p>125 g a 1,25 € — mais barato que o Nestlé Extrafino do Lupa (125 g, 1,49 €) e com muito menos açúcar.</p><p><span class="tag" style="--c:var(--merc)">Mercadona</span></p></div>
   <div class="card" style="--c:var(--dia)"><h3>Coalhada ou arroz-doce</h3><p>1,39–1,45 €, de vez em quando.</p><p><span class="tag" style="--c:var(--dia)">Dia</span></p></div>
   <div class="card" style="--c:var(--merc)"><h3>Gelatina</h3><p>A do Mercadona (+proteínas, 1,55 €) em vez da Royal do Unide (2,90 €).</p><p><span class="tag" style="--c:var(--merc)">Mercadona</span></p></div>
  </div>
  <p class="tip">Menos vantajosos: bombons de licor (2,79 €), gomas e barrinhas — pelo mesmo dinheiro, uma tablete de chocolate negro rende mais dias.</p>
  </section>`;
}
const BADGE={dia:["var(--dia)","🔴 Melhor no Dia"],lupa:["var(--lupa)","🟡 Melhor no Lupa"],merc:["var(--merc)","🟢 Melhor no Mercadona"],here:["var(--c)","⭐ Melhor aqui"],eq:["var(--muted)","⚖️ Mesmo preço"]};
function badge(b){const d=BADGE[b[0]];return `<span class="where" style="--w:${d[0]}"><b>${d[1]}</b>${b[1]?" — "+esc(b[1]):""}</span>`;}
function storePanel(s){
  let html=`<section id="p-${s.id}" role="tabpanel" class="store" style="--c:${s.color}" hidden>
   <div class="banner"><div class="top"><h2>${s.name}</h2><span class="pill">${s.pill}</span></div><p>${s.intro}</p></div>
   ${s.sections.some(x=>x.items.some(i=>i[4]))?`<div class="legend">${["here","eq","dia","lupa","merc"].filter(k=>!(k==="merc"&&s.id==="mercadona")&&!(k==="lupa"&&s.id==="lupa")&&!(k==="dia"&&s.id==="dia")).map(k=>badge([k,""])).join("")}</div>`:""}
   <div class="bar"><div class="prog"><small id="c-${s.id}"></small><div class="track"><i id="b-${s.id}"></i></div></div>
   <button class="btn left" data-s="${s.id}" aria-pressed="false">Mostrar só o que falta</button>
   <button class="btn clear" data-s="${s.id}">Desmarcar tudo</button></div>`;
  s.sections.forEach((sec,si)=>{
    html+=`<div class="sec"><h3>${esc(sec.t)}</h3><ul class="items">`;
    sec.items.forEach((it,ii)=>{
      const k=`${s.id}-${si}-${ii}`, on=!!state[k];
      html+=`<li class="item${on?" done":""}"><label><input type="checkbox" data-k="${k}"${on?" checked":""}><span class="name">${esc(it[0])}${it[1]?` <span class="qty">· ${esc(it[1])}</span>`:""}</span>${it[2]?`<span class="price">${esc(it[2])}</span>`:"<span></span>"}${it[3]?`<span class="note">${esc(it[3])}</span>`:""}${it[4]?badge(it[4]):""}</label></li>`;
    });
    html+=`</ul></div>`;
  });
  if(s.avoid) html+=`<div class="sec"><h3>Não comprar aqui</h3><div class="avoid">${s.avoid.map(a=>`<p><b>${esc(a[0])}</b> — ${esc(a[1])}</p>`).join("")}</div></div>`;
  return html+`</section>`;
}
main.innerHTML=resumo()+STORES.map(storePanel).join("");

function progress(id){
  const p=document.getElementById("p-"+id), all=p.querySelectorAll("input[type=checkbox]"), on=p.querySelectorAll("input:checked");
  document.getElementById("c-"+id).textContent=`${on.length} de ${all.length} marcados`;
  document.getElementById("b-"+id).style.width=(all.length?on.length/all.length*100:0)+"%";
  const n=document.getElementById("n-"+id); if(n) n.textContent=all.length-on.length;
}
STORES.forEach(s=>progress(s.id));

main.addEventListener("change",e=>{
  const k=e.target.dataset.k; if(!k) return;
  if(e.target.checked) state[k]=1; else delete state[k];
  e.target.closest(".item").classList.toggle("done",e.target.checked);
  save(); progress(k.split("-")[0]);
});
main.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.classList.contains("go")) return show(b.dataset.go,true);
  const id=b.dataset.s, p=document.getElementById("p-"+id);
  if(b.classList.contains("left")){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);p.classList.toggle("onlyleft",on)}
  if(b.classList.contains("clear")){p.querySelectorAll("input:checked").forEach(i=>{i.checked=false;delete state[i.dataset.k];i.closest(".item").classList.remove("done")});save();progress(id)}
});
function show(id,push){
  if(!TABS.some(t=>t.id===id)) id="resumo";
  tabs.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.id===id));
  main.querySelectorAll("[role=tabpanel]").forEach(p=>p.hidden=p.id!=="p-"+id);
  if(push && location.hash!=="#"+id) location.hash=id;
  window.scrollTo({top:0});
}
tabs.addEventListener("click",e=>{const t=e.target.closest(".tab"); if(t) show(t.dataset.id,true)});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||"resumo");
</script>
